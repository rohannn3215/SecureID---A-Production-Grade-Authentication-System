<header class="navbar-wrapper">
  <div class="navbar-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="brand-link">
      <div class="brand-icon-wrapper">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text-group">
        <span class="brand-name">Secure<span class="brand-accent">ID</span></span>
        <span class="brand-badge">OAuth2</span>
      </div>
    </a>

    <!-- Right Corner Actions -->
    <div class="nav-actions">
      @if (isLoggedIn) {
        <nav class="nav-menu">
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>
          @if (currentUser?.role === 'ROLE_ADMIN') {
            <a routerLink="/admin" routerLinkActive="active" class="nav-item admin-nav-item">
              <span class="admin-dot">●</span> Admin Panel
            </a>
          }
        </nav>

        <div class="user-pill">
          @if (currentUser?.imageUrl) {
            <img [src]="currentUser?.imageUrl" [alt]="currentUser?.name" class="avatar-img" />
          } @else {
            <div class="avatar-initial">
              {{ currentUser?.name ? currentUser!.name.charAt(0).toUpperCase() : 'U' }}
            </div>
          }
          <span class="user-greeting">
            {{ currentUser?.name || 'User' }}
          </span>
        </div>

        <button (click)="logout()" class="btn-logout" title="Sign out of SecureID">
          <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Logout</span>
        </button>
      } @else {
        <div class="guest-links">
          <a routerLink="/login" routerLinkActive="active" class="nav-link">Sign In</a>
          <a routerLink="/signup" routerLinkActive="active" class="btn-signup">Get Started</a>
        </div>
      }
    </div>
  </div>
</header>
